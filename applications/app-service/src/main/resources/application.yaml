server:
  port: 8087
spring:
  application:
    name: "crediya-solicitudes-ms"
  devtools:
    add-properties: false
  datasource:
    url: "jdbc:postgresql://localhost:5432/crediya_solicitudes"
    username: "crediya"
    password: "crediya_local"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
    open-in-view: false
    hibernate:
      ddl-auto: "update"
  jackson:
    property-naming-strategy: "SNAKE_CASE"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8087"